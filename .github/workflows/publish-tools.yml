# When tools.json changes on main, open or update a PR in atomicfi/public-docs that publishes it
# at public/agent-tools/deposit/tools.json (docs.atomicfi.com/agent-tools/deposit/tools.json).
#
# Needs the repository secret PUBLIC_DOCS_TOKEN: a fine-grained personal access token with resource
# owner atomicfi, access to public-docs only, and Contents and Pull requests set to read and write.
name: Publish tools.json to public-docs

on:
  push:
    branches: [main]
    paths:
      - tools.json
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, so two quick merges don't race on the same PR branch.
concurrency:
  group: publish-tools
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: example

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tools.json is current
        run: node example/scripts/build-tools-json.mjs --check

      - uses: actions/checkout@v4
        with:
          repository: atomicfi/public-docs
          token: ${{ secrets.PUBLIC_DOCS_TOKEN }}
          path: public-docs

      # Drop the $comment that marks the file as generated here, then format the copy with prettier as
      # public-docs does, so the PR shows only real changes.
      - name: Copy tools.json into public-docs
        working-directory: public-docs
        run: |
          jq 'del(.["$comment"])' ../example/tools.json > public/agent-tools/deposit/tools.json
          npx --yes prettier@3.9.6 --write public/agent-tools/deposit/tools.json

      - name: Open or update the public-docs PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PUBLIC_DOCS_TOKEN }}
          path: public-docs
          add-paths: public/agent-tools/deposit/tools.json
          branch: agent-tools/deposit-from-example
          delete-branch: true
          commit-message: |
            Update the deposit agent tool pack from deposit-agent-example

            From ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          title: Update the deposit agent tool pack from deposit-agent-example
          body: |
            Publishes `tools.json` from [${{ github.repository }}@${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) at `public/agent-tools/deposit/tools.json`.

            deposit-agent-example is the source of the tool definitions and the system prompt (MGMT-2513). Make changes there, not in this file. This PR is updated each time that repo's `main` changes them.
