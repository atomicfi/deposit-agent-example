# tools.json is the deposit agent tool pack that public-docs publishes (public-docs pulls it in with
# npm run update:deposit-tools). It's built from agent/tools/ and agent/agent/prompt.js by
# scripts/build-tools-json.mjs.
# - On a push to a branch other than main, rebuild it and commit it to that branch when it changed.
# - On main (which only takes reviewed pull requests) and on pull requests from forks (which this
#   workflow can't push to), fail if it's out of date.
name: Build tools.json

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: tools-json-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A pull request from this repo is already covered by the push to its branch.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit the rebuilt tools.json to the branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          node scripts/build-tools-json.mjs
          if git diff --quiet -- tools.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools.json
          git commit -m 'Rebuild tools.json from the tools and the system prompt'
          git push

      - name: Check tools.json is current
        run: node scripts/build-tools-json.mjs --check
